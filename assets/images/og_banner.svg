<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="150" r="220" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="500" r="250" fill="#2563eb" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(80, 80)">
    <rect width="84" height="84" rx="22" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <text x="42" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#gold)" text-anchor="middle">K</text>
    <circle cx="64" cy="22" r="6" fill="#38bdf8" />
  </g>

  <!-- Main Title -->
  <text x="185" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TÜRKİYE VE ULUSLARARASI BİLGİ BANKASI</text>
  <text x="185" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#f8fafc">Kooperatifler Ansiklopedisi</text>

  <!-- Headline & Subtitle -->
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Özgür Kooperatifçilik &amp; Mevzuat Platformu
  </text>
  <text x="80" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">
    1163 Sayılı Kanun • KOOPBİS • 7511 İntibak • Dış Denetim • Vergi Hukuku
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(80, 390)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="54" rx="14" fill="#13271f" stroke="#10b981" stroke-width="1.5" />
      <text x="105" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">🚨 26 Ekim 2026 İntibak</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(225, 0)">
      <rect width="230" height="54" rx="14" fill="#0f2334" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="115" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">📜 28+ Tip Anasözleşme</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect width="250" height="54" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="125" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="middle">🛠️ Karar Destek Sihirbazları</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(735, 0)">
      <rect width="240" height="54" rx="14" fill="#2d1235" stroke="#d946ef" stroke-width="1.5" />
      <text x="120" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f0abfc" text-anchor="middle">🤖 Ücretsiz AI Danışmanı</text>
    </g>
  </g>

  <!-- Bottom Bar / Footer inside Banner -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#334155" stroke-width="1" />
  <text x="80" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#94a3b8">
    https://mserman90.github.io/kooperatif-vikipedi/
  </text>
  <text x="1120" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">
    Açık Kaynak &amp; Kamu Yararı Projesi
  </text>
</svg>
